{% extends "base.html" %}
{% block title %}إنشاء حساب{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>إنشاء حساب جديد</h1>
  <form method="POST">
    <input type="text" name="username" placeholder="اسم المستخدم" required autofocus>
    <input type="password" name="password" placeholder="كلمة المرور" required>
    <button type="submit" class="btn">إنشاء الحساب</button>
  </form>
  <p class="switch-link">عندك حساب؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a></p>
</div>
{% endblock %}
